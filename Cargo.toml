[package]
name = "development-map"
version = "0.1.0"
edition = "2021"
authors = ["EvanBo"]
description = "Long-lived engineering context and evidence map for agents, by EvanBo"
license = "Apache-2.0"
readme = "README.md"
publish = false

[dependencies]
axum = "0.8"
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
subtle = "2"
percent-encoding = "2"
sha2 = "0.10"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
